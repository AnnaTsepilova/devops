{{- range .Values.repositories }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-repo-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: {{ .url | quote }}
  username: {{ .username | quote }}
  password: {{ .password | quote }}
  {{- with $.Values.repoConfig }}
  insecure: "{{ .insecure }}"
  enableLfs: "{{ .enableLfs }}"
  {{- end }}
{{- end }}

